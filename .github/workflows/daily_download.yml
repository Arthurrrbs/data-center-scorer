name: Téléchargement quotidien des données Enedis (TEST sans push)

on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 6h UTC
  workflow_dispatch:

jobs:
  fetch_enedis_data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v3

      - name: 🐍 Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Installer les dépendances
        run: pip install requests

      - name: 🚀 Lancer le script de téléchargement
        run: python scripts/enedis_downloader.py

      - name: ✅ TEST de commit sans push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git status
          echo "✅ Le fichier CSV est prêt, test sans push pour vérifier"
