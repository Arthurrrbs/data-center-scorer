name: Télécharger données Enedis tous les jours

on:
  schedule:
    - cron: '0 6 * * *'  # Tous les jours à 6h UTC (8h en France)
  workflow_dispatch:     # Permet aussi de lancer manuellement depuis GitHub

jobs:
  download-enedis-data:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Cloner le repo
      uses: actions/checkout@v3

    - name: 📦 Installer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 🔧 Installer les dépendances
      run: pip install requests

    - name: 🧠 Lancer le script de téléchargement
      run: python scripts/enedis_downloader.py

    - name: 📤 Commit et push des données
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add enedis_conso_communes_*.csv
        git commit -m "🔄 Données Enedis mises à jour automatiquement"
        git push
